# FIORD MeetingRoom_In: Insta360 One RS 1-Inch dual 200 deg fisheye (2 lenses = 2-camera rig), 107 captures,
# COLMAP model aligned to a Faro TLS scan (metric). Adapter: scripts/datasets/fiord.py; runs:
# sbatch/omni_rect.sbatch (rectify -> CEAR pinhole recipe), sbatch/omni_native.sbatch (3DGUT on the fisheyes).
# Set CEAR_DATA / CEAR_OUT to the multicam workspace before use (see docs/DATASETS.md).
sequence:
  name: fiord_meetingroom
  adapter: fiord               # scripts/datasets/fiord.py
  camera: fisheye              # native arm: 3DGUT (sbatch/omni_native.sbatch)
  folder: meetingroom          # folder inside the zip
  model: model                 # COLMAP model (binary, OPENCV_FISHEYE per lens, TLS frame)
  images: fisheyeimages        # cam1/, cam2/
  tls: meetingroom.e57         # Faro Focus ground truth
paths:
  data_root: "${CEAR_DATA}/fiord"
  out_root: "${CEAR_OUT}/{seq}"
download:
  url: https://zenodo.org/api/records/15181976/files/MeetingRoom_In.zip/content
  file: MeetingRoom_In.zip
  md5: 9e0be45675ea632d2c653045ff8359a5
  bytes: 4604401957
  extract: [fisheyeimages/, model/, meetingroom.e57, meetingroom.ply]
split:
  every: 8                     # every 8th capture (both lenses) held out
  capture_regex: "_(\\d+)_fisheye"
rect:
  scale: 0.5                   # (used only without size) virtual focal = 0.5 x fisheye focal
  size: 1000                   # every view 1000x1000 (viewer_shots needs one canvas size): centre 90 deg f=500, sides f=714
  ext: .png
native:
  downsample: 2                # 1632 x 1632 fisheyes for 3DGUT
  max_deg: 90                  # loss mask: rays within 90 deg of the lens axis (180 deg of the 200 deg FOV)
rect_variants:              # `fiord.py prepare --rig <name>` -> pipeline/rect_<name>/ (training rig variants)
  v9:                       # 9 overlapping 90 deg views: centre, 4 tilted 35 deg, 4 diagonal (22, 22); all within 85.4 deg
    views:
      - {yaw: 0, pitch: 0, fov: 90, name: c}
      - {yaw: 35, pitch: 0, fov: 90, name: r}
      - {yaw: -35, pitch: 0, fov: 90, name: l}
      - {yaw: 0, pitch: 35, fov: 90, name: u}
      - {yaw: 0, pitch: -35, fov: 90, name: d}
      - {yaw: 22, pitch: 22, fov: 90, name: ru}
      - {yaw: -22, pitch: 22, fov: 90, name: lu}
      - {yaw: 22, pitch: -22, fov: 90, name: rd}
      - {yaw: -22, pitch: -22, fov: 90, name: ld}
tls_align:                  # one-time hand-picked model<->scan alignment (user decision 2026-10-22; FIORD ships none).
  # Room corners read off top/side slices of the levelled splat (rect_igs_long; the camera was mounted upside down, so
  # model up = +y) and of the Faro scan (+z up, floor z 57.02); wall-floor junctions plus the same corners 1.5 m up
  # (model height via a provisional scale 0.5; ICP then refines scale). The rectangular room is ~180-deg symmetric,
  # so both corner assignments are stored; `fiord.py align` ICP-refines each and keeps the better (overlays in
  # <out>/pipeline/align_manual_<h>_{top,side}.jpg). The glass/blind wall (scan sees through it) is not used.
  sim3:                     # result of the pairs (hypothesis H2: pair residual median 0.111 m) + ICP on
                            # the rect_igs splat's opaque centres; F@10 cm 0.500 (acc 0.429 / comp 0.601).
                            # H1 (the 180-deg twin) scored F 0.472 and its chairs/bench fall on empty floor in the
                            # overlays; H2's bench row, table and whiteboard coincide. x_tls = s R x_model + t
    s: 0.539841
    R: [[-0.236564, -0.027820, -0.971217], [-0.971592, -0.000267, 0.236663], [-0.006843, 0.999613, -0.026967]]
    t: [2.495288, 0.023260, 58.364119]
    hypothesis: H2
    fitness: 0.500           # F@10 cm of the ICP source (validity check in geom / clean)
  hypotheses:
    H1:
      - {model: [7.002, -2.909, -2.346], scan: [0.75, 4.25, 57.02], what: 'room corner TR/A, floor'}
      - {model: [6.992, 0.091, -2.322], scan: [0.75, 4.25, 58.52], what: 'room corner TR/A, 1.5 m'}
      - {model: [2.238, -3.017, 9.069], scan: [6.05, 0.15, 57.02], what: 'room corner BR/B, floor'}
      - {model: [2.229, -0.017, 9.093], scan: [6.05, 0.15, 58.52], what: 'room corner BR/B, 1.5 m'}
      - {model: [-7.173, -3.017, 5.399], scan: [2.95, -3.75, 57.02], what: 'room corner BL/C, floor'}
      - {model: [-7.183, -0.017, 5.423], scan: [2.95, -3.75, 58.52], what: 'room corner BL/C, 1.5 m'}
      - {model: [-2.111, -2.905, -6.317], scan: [-2.10, 0.20, 57.02], what: 'room corner TL/D, floor'}
      - {model: [-2.120, 0.095, -6.293], scan: [-2.10, 0.20, 58.52], what: 'room corner TL/D, 1.5 m'}
    H2:
      - {model: [7.002, -2.909, -2.346], scan: [2.95, -3.75, 57.02], what: 'room corner TR/C, floor'}
      - {model: [6.992, 0.091, -2.322], scan: [2.95, -3.75, 58.52], what: 'room corner TR/C, 1.5 m'}
      - {model: [2.238, -3.017, 9.069], scan: [-2.10, 0.20, 57.02], what: 'room corner BR/D, floor'}
      - {model: [2.229, -0.017, 9.093], scan: [-2.10, 0.20, 58.52], what: 'room corner BR/D, 1.5 m'}
      - {model: [-7.173, -3.017, 5.399], scan: [0.75, 4.25, 57.02], what: 'room corner BL/A, floor'}
      - {model: [-7.183, -0.017, 5.423], scan: [0.75, 4.25, 58.52], what: 'room corner BL/A, 1.5 m'}
      - {model: [-2.111, -2.905, -6.317], scan: [6.05, 0.15, 57.02], what: 'room corner TL/B, floor'}
      - {model: [-2.120, 0.095, -6.293], scan: [6.05, 0.15, 58.52], what: 'room corner TL/B, 1.5 m'}
