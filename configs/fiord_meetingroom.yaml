# FIORD MeetingRoom_In: Insta360 One RS 1-Inch dual 200 deg fisheye (2 lenses = 2-camera rig), 107 captures,
# COLMAP model aligned to a Faro TLS scan (metric). Adapter: scripts/datasets/fiord.py; runs:
# sbatch/omni_rect.sbatch (rectify -> CEAR pinhole recipe), sbatch/omni_native.sbatch (3DGUT on the fisheyes).
# Set CEAR_DATA / CEAR_OUT to the multicam workspace before use (see docs/DATASETS.md).
sequence:
  name: fiord_meetingroom
  adapter: fiord               # scripts/datasets/fiord.py
  camera: fisheye              # native arm: 3DGUT (sbatch/omni_native.sbatch)
  folder: meetingroom          # folder inside the zip
  model: model                 # COLMAP model (binary, OPENCV_FISHEYE per lens, TLS frame)
  images: fisheyeimages        # cam1/, cam2/
  tls: meetingroom.e57         # Faro Focus ground truth
paths:
  data_root: "${CEAR_DATA}/fiord"
  out_root: "${CEAR_OUT}/{seq}"
download:
  url: https://zenodo.org/api/records/15181976/files/MeetingRoom_In.zip/content
  file: MeetingRoom_In.zip
  md5: 9e0be45675ea632d2c653045ff8359a5
  bytes: 4604401957
  extract: [fisheyeimages/, model/, meetingroom.e57, meetingroom.ply]
split:
  every: 8                     # every 8th capture (both lenses) held out
  capture_regex: "_(\\d+)_fisheye"
rect:
  scale: 0.5                   # (used only without size) virtual focal = 0.5 x fisheye focal
  size: 1000                   # every view 1000x1000 (viewer_shots needs one canvas size): centre 90 deg f=500, sides f=714
  ext: .png
native:
  downsample: 2                # 1632 x 1632 fisheyes for 3DGUT
  max_deg: 90                  # loss mask: rays within 90 deg of the lens axis (180 deg of the 200 deg FOV)
rect_variants:              # `fiord.py prepare --rig <name>` -> pipeline/rect_<name>/ (training rig variants)
  v9:                       # 9 overlapping 90 deg views: centre, 4 tilted 35 deg, 4 diagonal (22, 22); all within 85.4 deg
    views:
      - {yaw: 0, pitch: 0, fov: 90, name: c}
      - {yaw: 35, pitch: 0, fov: 90, name: r}
      - {yaw: -35, pitch: 0, fov: 90, name: l}
      - {yaw: 0, pitch: 35, fov: 90, name: u}
      - {yaw: 0, pitch: -35, fov: 90, name: d}
      - {yaw: 22, pitch: 22, fov: 90, name: ru}
      - {yaw: -22, pitch: 22, fov: 90, name: lu}
      - {yaw: 22, pitch: -22, fov: 90, name: rd}
      - {yaw: -22, pitch: -22, fov: 90, name: ld}
