# ROQ-01, LiDAR-supervised variant: own training dir with LiDAR depth targets (sbatch/spires_export.sbatch
# DEPTH_TARGETS=1), so EDGS keeps only LiDAR-consistent points and the trainer can use --depth-lambda.
#   STAGES=layout sbatch/spires_prepare.sbatch configs/spires_roq01_depth.yaml
#   DEPTH_TARGETS=1 ARM_FLAGS="--strategy improved --budget 4000000 --depth-lambda 0.05" sbatch/spires_export.sbatch <this>
base: spires_roq01.yaml
adapter:
  layout_own_train: true
paths:
  out_root: "${CEAR_OUT}/spires/{seq}/run_center_depth"
