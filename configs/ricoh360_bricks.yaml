# Ricoh360 (EgoNeRF) scene `bricks`: 360 equirect 1920x960, 100 frames, SfM poses (arbitrary units), official
# 50/50 split. Adapter: scripts/datasets/ricoh360.py; runs: sbatch/omni_rect.sbatch, sbatch/omni_native.sbatch.
# Set CEAR_DATA / CEAR_OUT to the multicam workspace before use (see docs/DATASETS.md).
sequence:
  name: ricoh360_bricks
  adapter: ricoh360             # scripts/datasets/ricoh360.py
  camera: equirect              # native arm: ODGS (sbatch/omni_native.sbatch)
  scene: bricks
paths:
  data_root: "${CEAR_DATA}/ricoh360"
  out_root: "${CEAR_OUT}/{seq}"
download:
  drive_id: 1qytZCyonAwroz7r6hEJ9LDBDh0rr_xuh     # EgoNeRF Drive folder 1kqLAATjSSDwfLHI5O7RTfM9NOUi7PvcK
  file: Ricoh360.zip
  bytes: 2713936566
rect:                       # virtual pinhole views per panorama (degrees; yaw right, pitch up)
  scale: 1.0                # (used only without size) focal = scale x W / 2pi (source pixel density)
  size: 728                 # every view 728x728 (viewer_shots needs one canvas size; 100 deg -> f=305 = source density)
  ext: .png
  # 4 horizontal 100 deg views + up; no straight-down view: the camera operator fills it in every panorama
  views:
    - {yaw: 0, pitch: 0, fov: 100, name: h0}
    - {yaw: 90, pitch: 0, fov: 100, name: h90}
    - {yaw: 180, pitch: 0, fov: 100, name: h180}
    - {yaw: 270, pitch: 0, fov: 100, name: h270}
    - {yaw: 0, pitch: 90, fov: 90, name: up}
rect_variants:              # `ricoh360.py prepare --rig <name>` -> pipeline/rect_<name>/
  grav:                     # same 5 views, levelled: about the world up (mean camera up) and each frame's heading
    gravity: true
  dense:                    # 17 overlapping views: 8 horizontal (45 deg steps, 100 deg), 4 at +45 deg, zenith, 4 at -30 deg
                            # (90 deg; reach -75 deg, short of the operator at the nadir). Closes the orientation gaps the
                            # 5-view rig leaves (levelled vs tilted test rigs differed by 1.3 dB each way)
    views:
      - {yaw: 0, pitch: 0, fov: 100, name: h0}
      - {yaw: 45, pitch: 0, fov: 100, name: h45}
      - {yaw: 90, pitch: 0, fov: 100, name: h90}
      - {yaw: 135, pitch: 0, fov: 100, name: h135}
      - {yaw: 180, pitch: 0, fov: 100, name: h180}
      - {yaw: 225, pitch: 0, fov: 100, name: h225}
      - {yaw: 270, pitch: 0, fov: 100, name: h270}
      - {yaw: 315, pitch: 0, fov: 100, name: h315}
      - {yaw: 0, pitch: 45, fov: 90, name: u0}
      - {yaw: 90, pitch: 45, fov: 90, name: u90}
      - {yaw: 180, pitch: 45, fov: 90, name: u180}
      - {yaw: 270, pitch: 45, fov: 90, name: u270}
      - {yaw: 0, pitch: 90, fov: 90, name: up}
      - {yaw: 45, pitch: -30, fov: 90, name: d45}
      - {yaw: 135, pitch: -30, fov: 90, name: d135}
      - {yaw: 225, pitch: -30, fov: 90, name: d225}
      - {yaw: 315, pitch: -30, fov: 90, name: d315}
