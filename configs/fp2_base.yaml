# FusionPortable v2 dataset config — facts shared by every FP2 sequence (one sensor suite; the calibration
# release differs per platform/date and is set per sequence). Sequence configs: `base: fp2_base.yaml` + name,
# calibration release and Google Drive ids. Data: https://fusionportable.github.io/dataset/fusionportable_v2/
# Run with CEAR_DATA=<ws>/data/fusionportable CEAR_OUT=<ws>/outputs (sbatch/fp2_*.sbatch set these defaults).
dataset: fusionportable_v2
sequence:
  data_root: "${CEAR_DATA}/{seq}"          # <seq>.bag (from <seq>.7z), gt_traj.txt, fastlio2.txt
paths:
  out_root: "${CEAR_OUT}/fp2_{seq}"
download:                                  # scripts/datasets/fusionportable_fetch.py
  calib_repo: https://github.com/fusionportable/calibration_files.git
  calib_dir: "${CEAR_DATA}/calibration_files"
  files: {}                                # per sequence: {<file name in data_root>: <gdrive id>}
rig:
  # every frame camera of the rig, in order; names = calibration yaml stems (frame_cam00.yaml ...)
  cameras: [frame_cam00, frame_cam01]
  topics: {frame_cam00: /stereo/frame_left/image_raw/compressed, frame_cam01: /stereo/frame_right/image_raw/compressed}
  ref_camera: frame_cam00                  # rig reference (its pose = the rig pose)
  calib_release: ""                        # per sequence, e.g. 20230912_calib
  # The yaml extrinsics are "sensor (reference) -> target"; direction verified by LiDAR->image edge
  # alignment (fusionportable.py check-extrinsics): ouster00.yaml quaternion_sensor_frame_cam00 maps
  # LiDAR points into the camera frame iff lidar_cam_direction = lidar_to_cam.
  lidar_cam_direction: auto                # auto | lidar_to_cam | cam_to_lidar (auto = measured)
  stereo_direction: ref_to_cam             # frame_cam01.yaml quaternion/translation_stereo maps cam00 -> cam01
  quat_order: wxyz                         # calibration yaml quaternions are (qw, qx, qy, qz)
  timeshift_cam_s: 0.0                     # images are already exposure-centred (paper §3.1.3)
lidar:
  topic: /os_cloud_node/points
  stamp: end                               # message stamp = last point of the scan (per-point ns offsets in field t)
  every: 2                                 # use every Nth scan for the static cloud
  min_range: 0.6                           # drops the rig / operator / robot body
  max_range: 30.0
  voxel: 0.02                              # static cloud voxel size (m)
  init_points: 400000                      # points written to points3D.txt (init cloud), like CEAR
gt:
  file: gt_traj.txt                        # TUM: t x y z qx qy qz qw. Room sequences: Leica MS60 total station =
  position_only: true                      # 3-DoF prism positions (identity quaternions), so orientation comes
  lio_file: fastlio2.txt                   # from SfM (rig-constrained) / the provided FAST-LIO2 odometry
select:
  fps: 4.0                                 # keyframes per second kept (rig frames; each = both cameras)
  sharpest_in_window: true                 # pick the sharpest rig frame (min over cameras of Laplacian var) per slot
  max_frames: 1200
undistort:
  alpha: 0.0                               # cv2.getOptimalNewCameraMatrix alpha: 0 = all-valid pinhole crop
  center_pp: true                          # principal point at the image centre (viewer cameras are centred)
  shared_K: true                           # one pinhole K for every rig camera
split:
  test_every: 8                            # every 8th keyframe (both cameras) held out, like CEAR on-path
poses:
  source: colmap_rig                       # colmap_rig (SfM, rig-constrained, sim3 to GT positions) | lio
  matcher: sequential
  overlap: 15
