# ROQ-01, cube variant: the export_viewer recipe trained on 3 native-resolution 60 deg pinhole crops per fisheye
# image (adapter.rect_cube) instead of one 100 deg view; held-out frames unchanged (centre view).
#   STAGES=rect,layout sbatch/spires_prepare.sbatch configs/spires_roq01_cube.yaml; then sbatch/spires_export.sbatch
base: spires_roq01.yaml
adapter:
  rect_variant: cube
paths:
  out_root: "${CEAR_OUT}/spires/{seq}/run_cube"
